[package]
name = "presscraft-book-publisher"
version = "0.1.0"
description = "PressCraft Book Publisher desktop shell"
edition = "2021"

[lib]
name = "presscraft_book_publisher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.2", features = [] }
tauri-plugin-single-instance = "2.4.0"

